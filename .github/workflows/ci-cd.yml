name: JobFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Build & Test All Services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: jobflow
        ports:
          - 5432:5432
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/jobflow?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test_jwt_secret_key_which_is_more_than_32_bytes_long_xxxxxx
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build JS SDK
        run: |
          cd packages/sdk-js
          npm ci
          npm run build

      - name: Install & Build CLI Tool
        run: |
          cd packages/cli
          npm ci
          npm run build

      - name: Install & Build Frontend SPA
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client & Migrate Schema
        run: |
          cd backend
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Build Backend TypeScript
        run: |
          cd backend
          npm run build

      - name: Run Backend Integration & Unit Tests
        run: |
          cd backend
          npm test

  build-and-push:
    name: Build & Push Docker Images
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: env.DOCKERHUB_USERNAME != ''
        uses: actions/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.DOCKERHUB_USERNAME != ''
        uses: actions/setup-buildx-action@v3

      - name: Login to DockerHub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jobflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jobflow-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/jobflow-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/jobflow-backend:buildcache,mode=max

      - name: Build and Push Frontend Docker Image
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jobflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jobflow-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/jobflow-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/jobflow-frontend:buildcache,mode=max

  deploy:
    name: Deploy to Kubernetes Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        if: env.KUBECONFIG != ''
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Set up Kubeconfig
        if: env.KUBECONFIG != ''
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy to Kubernetes with Helm
        if: env.KUBECONFIG != ''
        run: |
          helm upgrade --install jobflow ./deployment/helm \
            --namespace jobflow \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/jobflow-backend \
            --set image.tag=${{ github.sha }}
